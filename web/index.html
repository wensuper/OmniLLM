<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<!-- The page speaks Chinese and English itself; a browser's machine
     translation would only mangle model names, commands and codes. -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss: ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="omnillm-build" content="dev">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080912" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OmniLLM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<title>OmniLLM</title>
</head>
<body>
<div id="app">
  <section id="boot" class="screen center">
    <img src="icon.svg" alt="" class="boot-mark">
    <div class="spinner" aria-hidden="true"></div>
    <p id="boot-text" class="muted"></p>
    <button id="boot-retry" type="button" class="primary" data-t="bootRetry" hidden></button>
  </section>

  <section id="welcome" class="screen welcome" hidden>
    <div class="wl">
      <div class="wl-top">
        <!-- Brand: the name and the slogan (the brand's own words, never translated). -->
        <div class="wl-brand"><img src="icon.svg" alt="" width="28" height="28"><span>OmniLLM</span></div>
        <span class="wl-chip"><span class="wl-chip-lock" aria-hidden="true"></span><span data-t="e2eChip"></span></span>
      </div>
      <p id="welcome-note" class="warn welcome-note" role="status" hidden></p>
      <div class="wl-main">
        <div class="wl-copy">
          <p class="wl-eyebrow">Your AI, Everywhere</p>
          <h1 class="wl-title"><span data-t="welcomeTitle1"></span><span class="wl-grad" data-t="welcomeTitle2"></span></h1>
          <ol id="welcome-body" class="wl-steps" role="list">
            <li><span class="wl-n" aria-hidden="true">01</span><span data-t="step1"></span></li>
            <li><span class="wl-n" aria-hidden="true">02</span><span data-t="step2"></span></li>
            <li><span class="wl-n" aria-hidden="true">03</span><span data-t="step3"></span></li>
          </ol>
          <div class="wl-actions">
            <button id="scan" class="primary wl-scan" data-t="scan"></button>
            <details id="paste" class="paste">
              <summary data-t="pasteInstead"></summary>
              <textarea id="paste-text" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
              <button id="paste-go" class="secondary" data-t="add"></button>
            </details>
            <p id="welcome-err" class="err" role="alert"></p>
            <button id="no-hub" type="button" class="wl-link" data-t="noHub" aria-expanded="false" aria-controls="get-hub"></button>
            <div id="get-hub" class="wl-get" hidden>
              <p class="wl-get-title" data-t="getHubTitle"></p>
              <p class="muted small" data-t="getHubBody"></p>
              <code class="wl-cmd">curl -fsSL https://raw.githubusercontent.com/wensuper/OmniLLM/main/install.sh | sh</code>
              <p class="muted small" data-t="getHubHang"></p>
              <div class="wl-get-actions">
                <button id="get-share" type="button" class="secondary" data-t="getHubShare"></button>
                <button id="get-copy" type="button" class="secondary" data-t="getHubCopy"></button>
              </div>
              <a class="wl-guide" href="https://github.com/wensuper/OmniLLM#installation" target="_blank" rel="noopener" data-t="getHubGuide"></a>
            </div>
          </div>
        </div>
        <!-- Picture only: the Mac in the middle, this device and others around it, an encrypted line between. -->
        <svg class="wl-orbit" viewBox="0 0 320 320" aria-hidden="true">
          <defs>
            <linearGradient id="wl-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="wl-s1"/><stop offset="1" class="wl-s2"/></linearGradient>
            <radialGradient id="wl-core"><stop offset="0" class="wl-c1"/><stop offset="1" class="wl-c2"/></radialGradient>
          </defs>
          <circle cx="160" cy="160" r="150" class="wl-ring wl-ring-3"/>
          <circle cx="160" cy="160" r="118" class="wl-ring wl-ring-2"/>
          <circle cx="160" cy="160" r="82" class="wl-ring wl-ring-1"/>
          <circle cx="160" cy="160" r="72" fill="url(#wl-core)"/>
          <g class="wl-spin">
            <path d="M160 160L160 42" class="wl-beam"/>
            <path d="M160 160L262 219" class="wl-beam wl-beam-2"/>
            <path d="M160 160L58 219" class="wl-beam wl-beam-3"/>
            <g class="wl-node wl-node-me" transform="translate(160 42)"><circle r="17"/><rect x="-5" y="-8" width="10" height="16" rx="2"/></g>
            <g class="wl-node" transform="translate(262 219)"><circle r="14"/><rect x="-7" y="-5" width="14" height="10" rx="1.5"/></g>
            <g class="wl-node" transform="translate(58 219)"><circle r="14"/><rect x="-6" y="-7" width="12" height="14" rx="1.5"/></g>
          </g>
          <image href="icon.svg" x="128" y="128" width="64" height="64"/>
          <g class="wl-lock" transform="translate(206 128)"><rect x="-13" y="-13" width="26" height="26" rx="8"/><path d="M-4.5 -1v-3a4.5 4.5 0 0 1 9 0v3M-6 -1h12v8h-12z"/></g>
        </svg>
      </div>
    </div>
  </section>

  <section id="scanner" class="screen" hidden>
    <video id="cam" playsinline muted></video>
    <canvas id="cam-canvas" hidden></canvas>
    <p class="scan-hint" data-t="scanHint"></p>
    <button id="scan-stop" class="secondary floating" data-t="cancel"></button>
  </section>

  <section id="pairing" class="screen center" hidden>
    <h1 data-t="pairTitle"></h1>
    <div id="pair-ask" hidden>
      <p class="muted" data-t="pairAsk"></p>
      <p id="pair-host" class="muted small via"></p>
      <p id="pair-replace" class="warn" hidden></p>
      <button id="pair-go" class="primary" data-t="add"></button>
      <button id="pair-cancel" class="secondary" data-t="cancel"></button>
    </div>
    <p id="pair-status" class="muted" role="status"></p>
    <button id="pair-stop" type="button" class="link small" data-t="cancel" hidden></button>
    <div id="sas" class="sas" hidden></div>
    <div id="pair-wait" class="pair-wait muted small" hidden><span class="spinner sm" aria-hidden="true"></span><span data-t="pairWait"></span></div>
    <button id="pair-mismatch" type="button" class="link small" data-t="pairMismatch" hidden></button>
    <p id="pair-err" class="err" role="alert"></p>
    <button id="pair-retry" class="secondary" data-t="back" hidden></button>
  </section>

  <section id="chat" class="screen chat" hidden>
    <!-- The chat list: a sidebar on wide screens, a drawer on phones. -->
    <aside id="drawer" class="drawer" hidden>
      <div class="drawer-panel">
        <div class="brand"><img class="brand-mark" src="icon.svg" alt="" width="32" height="32"><span class="brand-text"><span class="brand-name">OmniLLM</span><span class="brand-sub">Your AI, Everywhere</span></span><button id="side-hide" type="button" class="ibtn side-hide" data-ta="hideSide"><span class="ic i-side"></span></button><button id="drawer-close" type="button" class="ibtn drawer-x"><span class="ic i-x"></span></button></div>
        <button id="new-side" type="button" class="newchat"><span class="ic i-compose s16"></span><span data-t="newChat"></span></button>
        <label class="search"><span class="ic i-search s16"></span><input id="chat-search" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></label>
        <ul id="chat-list"></ul>
        <div class="drawer-foot">
          <button id="mac" type="button" class="mac" aria-haspopup="menu" aria-expanded="false" aria-controls="mac-menu"><span id="live-dot" class="live-dot" role="img"></span><span class="mac-t"><b data-t="yourMac"></b><small id="mac-state"></small></span><span class="ic i-updown s16"></span></button>
          <div id="mac-menu" class="pop mac-menu" role="menu" hidden>
            <div class="pop-head"><span class="ic i-mac"></span><span class="pop-head-t"><b id="mac-head"></b><small id="device-line"></small></span></div>
            <hr>
            <button id="lang-btn" type="button" class="pop-item" role="menuitem" aria-expanded="false" aria-controls="lang-list"><span class="ic i-lang s16"></span><span class="nm" data-t="language"></span><small id="lang-now"></small><span class="ic i-chev s14 lang-chev"></span></button>
            <div id="lang-list" class="lang-list" role="group" hidden>
              <button type="button" class="pop-item" role="menuitemradio" data-lang=""><span class="nm" data-t="langMac"></span><span class="ic i-check s16 tick"></span></button>
              <button type="button" class="pop-item" role="menuitemradio" data-lang="zh"><span class="nm">中文</span><span class="ic i-check s16 tick"></span></button>
              <button type="button" class="pop-item" role="menuitemradio" data-lang="en"><span class="nm">English</span><span class="ic i-check s16 tick"></span></button>
            </div>
            <button id="keys-btn" type="button" class="pop-item keys-item" role="menuitem"><span class="ic i-key s16"></span><span class="nm" data-t="shortcuts"></span><small class="kbd-hint" data-k="⌘/"></small></button>
            <button id="install-tip" type="button" class="pop-item" role="menuitem" hidden><span class="ic i-home s16"></span><span class="nm" data-t="addHome"></span></button>
            <hr>
            <p class="pop-note" data-t="chatsLocal"></p>
            <button id="forget" type="button" class="pop-item danger" role="menuitem"><span class="ic i-trash s16"></span><span class="nm" data-t="forget"></span></button>
          </div>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="bar">
        <button id="menu" type="button" class="ibtn" data-ta="chats"><span class="ic i-menu s20"></span></button>
        <button id="bar-title" type="button" class="bar-t"></button>
        <button id="new" type="button" class="ibtn" data-ta="newChat"><span class="ic i-compose s20"></span></button>
      </header>
      <!-- Sidebar hidden on a wide screen: show it again, or start a chat. -->
      <div class="side-btns">
        <button id="side-show" type="button" class="ibtn" data-ta="showSide"><span class="ic i-side s20"></span></button>
        <button id="new-float" type="button" class="ibtn" data-ta="newChat"><span class="ic i-compose s20"></span></button>
      </div>
      <!-- The chat's name at the top (wide screens; phones have it in the bar). Click to rename. -->
      <div id="chat-head" class="chat-head" hidden><button id="head-title" type="button" class="head-t"></button></div>
      <main id="log" class="log" aria-live="polite"></main>
      <div class="dock">
        <div class="dock-in">
          <div class="jump-wrap"><button id="jump" type="button" class="jump" hidden></button></div>
          <div id="banner" class="banner" role="status" hidden></div>
          <form id="composer" class="composer">
            <div id="pending" class="pending" hidden></div>
            <textarea id="input" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
            <div class="comp-row">
              <button id="attach" class="ibtn attach" type="button"><span class="ic i-image"></span></button>
              <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/heic,image/heif" multiple hidden>
              <div class="mwrap">
                <button id="mpick" type="button" class="mpick" aria-haspopup="listbox" aria-expanded="false" aria-controls="mmenu"><span id="pick-dot" class="live-dot" aria-hidden="true"></span><span id="pick-name" class="nmx"></span><span class="ic i-chev s14 pick-chev"></span></button>
                <div id="mmenu" class="pop mmenu" role="listbox" tabindex="-1" hidden></div>
              </div>
              <!-- The chosen model's id lives here (the picker above draws it). -->
              <select id="model" hidden></select>
              <span class="sp"></span>
              <button id="mic" class="ibtn mic" type="button" aria-pressed="false" hidden><span class="ic i-mic"></span><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button>
              <button id="send" class="send" type="submit" data-ta="send"></button>
            </div>
          </form>
        </div>
      </div>
      <div id="drop" class="drop" hidden><span class="ic i-image s20"></span><span data-t="dropHere"></span></div>
    </div>
  </section>
  <!-- In-page questions (delete a chat, remove this device, a tip). -->
  <dialog id="ask" class="ask">
    <p id="ask-text"></p>
    <div class="ask-btns"><button id="ask-no" type="button" class="secondary"></button><button id="ask-yes" type="button" class="primary"></button></div>
  </dialog>
  <dialog id="keys" class="ask keys">
    <h2 data-t="shortcuts"></h2>
    <table id="keys-table"></table>
    <div class="ask-btns"><button id="keys-ok" type="button" class="primary" data-t="gotIt"></button></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
