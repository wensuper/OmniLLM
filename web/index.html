<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<!-- The page speaks Chinese and English itself; a browser's machine
     translation would only mangle model names, commands and codes. -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss: ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="omnillm-build" content="dev">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080912" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OmniLLM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
<title>OmniLLM</title>
</head>
<body>
<div id="app">
  <section id="boot" class="screen center">
    <img src="icon.svg" alt="" class="boot-mark">
    <div class="spinner" aria-hidden="true"></div>
    <p id="boot-text" class="muted"></p>
    <button id="boot-retry" type="button" class="primary" data-t="bootRetry" hidden></button>
  </section>

  <!-- Before pairing. One action per device (docs/design.md §13.3, welcome page):
       a computer pastes, a phone scans, an iPhone browser first goes to the
       Home Screen, a page inside another app opens in the browser. -->
  <section id="welcome" class="screen welcome" hidden>
    <div class="wl">
      <div class="wl-top">
        <div class="wl-brand"><img src="icon.svg" alt="" width="28" height="28"><span>OmniLLM</span></div>
        <div class="wl-right"><div class="tools" data-tools="theme"></div><div class="seg" role="group" data-ta="language"><button type="button" data-setlang="zh" lang="zh-CN">中文</button><button type="button" data-setlang="en" lang="en">EN</button></div></div>
      </div>
      <p id="welcome-note" class="warn welcome-note" role="status" hidden></p>
      <div class="wl-main">
        <div class="wl-copy">

          <div id="wv-start" class="wv">
            <h1 id="start-title" class="wl-title"></h1>
            <p id="start-sub" class="wl-sub"></p>
            <button id="scan" type="button" class="vf">
              <span class="vf-grid"></span>
              <span class="vf-c vf-c1"></span><span class="vf-c vf-c2"></span><span class="vf-c vf-c3"></span><span class="vf-c vf-c4"></span>
              <span class="vf-sweep"></span>
              <span class="vf-mid"><span class="vf-cam"><span class="ic i-camera s28"></span></span><span data-t="tapScan"></span></span>
            </button>
            <button id="paste-open" type="button" class="secondary wl-wide"><span class="ic i-paste s18"></span><span data-t="pasteBtn"></span></button>
            <!-- iPhone and iPad: the Home Screen is a choice, never a step. -->
            <button id="home-open" type="button" class="link quiet home-open" data-t="homeOpen" hidden></button>
            <!-- Computers: the three steps, numbered as on the console picture. -->
            <ol class="dsteps" id="dsteps" hidden>
              <li><b>1</b><span data-t="dStep1"></span></li>
              <li><b>2</b><span data-t="dStep2"></span></li>
              <li><b>3</b><span data-t="dStep3"></span></li>
            </ol>
            <form id="paste" class="pastebar" hidden>
              <span class="ic i-link s20 pb-ic"></span>
              <input id="paste-text" data-ta="pastePh" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
              <span id="paste-kbd" class="kbd" hidden></span>
              <button id="paste-go" type="submit" class="primary" data-t="connect"></button>
            </form>
            <p id="welcome-err" class="err" role="alert"></p>
            <button id="no-hub-near" type="button" class="link no-hub-near" hidden><span data-t="noHub"></span><span class="ic i-arrow s14"></span></button>
          </div>

          <div id="wv-get" class="wv" hidden>
            <button id="get-back" type="button" class="link back"><span class="ic i-back s16"></span><span data-t="back"></span></button>
            <h1 class="wl-title" data-t="getHubTitle"></h1>
            <p id="get-body" class="wl-sub"></p>
            <div class="cmd"><code class="wl-cmd">curl -fsSL https://raw.githubusercontent.com/wensuper/OmniLLM/main/install.sh | sh</code><button id="get-copy" type="button" class="cmd-copy"><span class="ic i-copy s16"></span><span data-t="getHubCopy"></span></button></div>
            <button id="get-share" type="button" class="primary wl-wide" hidden><span class="ic i-share s18"></span><span data-t="getHubShare"></span></button>
            <a class="link wl-guide" href="https://github.com/wensuper/OmniLLM#installation" target="_blank" rel="noopener" data-t="getHubGuide"></a>
          </div>

          <div id="wv-home" class="wv" hidden>
            <button id="home-back" type="button" class="link back"><span class="ic i-back s16"></span><span data-t="back"></span></button>
            <span class="appicon"><img src="icon.svg" alt="" width="48" height="48"><span class="appicon-plus"><span class="ic i-plus s14"></span></span></span>
            <h1 class="wl-title" data-t="homeTitle"></h1>
            <p id="home-sub" class="wl-sub"></p>
            <ol class="steps">
              <li><span class="step-ic"><span class="ic i-share s20"></span></span><span id="home-s1"></span></li>
              <li><span class="step-ic"><span class="ic i-addsq s20"></span></span><span data-t="homeS2"></span></li>
              <li><span class="step-ic"><span class="ic i-scan s20"></span></span><span data-t="homeS3"></span></li>
            </ol>
          </div>

          <div id="wv-inapp" class="wv" hidden>
            <span class="tile"><span class="ic i-compass s30"></span></span>
            <h1 id="inapp-title" class="wl-title"></h1>
            <p id="inapp-sub" class="wl-sub"></p>
            <!-- Using it here comes first; the browser is the other way. -->
            <div class="wv-acts gate-acts">
              <button id="inapp-here" type="button" class="primary wl-wide"></button>
              <button id="inapp-copy" type="button" class="secondary wl-wide"><span class="ic i-copy s18"></span><span data-t="copyForBrowser"></span></button>
            </div>
            <p id="inapp-how" class="gate-how"></p>
          </div>

          <div id="wv-vol" class="wv" hidden>
            <span class="tile warn-tile"><span class="ic i-warn s28"></span></span>
            <h1 class="wl-title" data-t="volTitle"></h1>
            <p class="wl-sub" data-t="volSub"></p>
            <div class="wv-acts gate-acts">
              <button id="vol-here" type="button" class="primary wl-wide" data-t="onceHere"></button>
              <button id="vol-copy" type="button" class="secondary wl-wide"><span class="ic i-copy s18"></span><span data-t="copyUrl"></span></button>
            </div>
          </div>

        </div>
        <!-- Computers: where "Add device → Copy link" is on the other computer (the console's own words). -->
        <div class="wl-art" aria-hidden="true">
          <div class="mock">
            <div class="mock-bar"><i></i><i></i><i></i><span data-t="consoleName"></span><em class="badge b1">1</em></div>
            <div class="mock-body">
              <p class="mock-h" data-t="addDevice"></p>
              <div class="mock-tog"><span data-t="kindPhone"></span><span class="on" data-t="kindComputer"></span><em class="badge b2">2</em></div>
              <div class="mock-field">https://omni.ixxzh.com/#pair=omnillm3-9fQ2…</div>
              <div class="mock-btn"><span data-t="copyLink"></span><em class="badge b3">3</em><span class="mock-cursor"></span></div>
              <p class="mock-note" data-t="mockExpires"></p>
            </div>
          </div>
        </div>
      </div>
      <div class="wl-foot">
        <button id="no-hub" type="button" class="link" data-t="noHub"></button>
        <span class="e2e"><span class="ic i-lock s14"></span><span data-t="e2e"></span></span>
        <!-- Computers: why it is safe to paste here, in three short lines. -->
        <ul class="trust" hidden>
          <li><span class="ic i-lock s16"></span><span data-t="trustE2e"></span></li>
          <li><span class="ic i-link s16"></span><span data-t="trustOnce"></span></li>
          <li><span class="ic i-shield s16"></span><span data-t="trustVerify"></span></li>
        </ul>
      </div>
    </div>
  </section>

  <section id="scanner" class="screen" hidden>
    <video id="cam" playsinline muted></video>
    <canvas id="cam-canvas" hidden></canvas>
    <div class="cam-frame" aria-hidden="true"><span class="vf-c vf-c1"></span><span class="vf-c vf-c2"></span><span class="vf-c vf-c3"></span><span class="vf-c vf-c4"></span><span class="vf-sweep"></span></div>
    <p class="scan-hint" data-t="scanHint"></p>
    <button id="scan-stop" type="button" class="cam-x glass" data-ta="cancel"><span class="ic i-x s20"></span></button>
    <button id="scan-paste" type="button" class="secondary glass cam-paste"><span class="ic i-paste s18"></span><span data-t="pasteBtn"></span></button>
  </section>

  <section id="pairing" class="screen welcome" hidden>
    <div class="wl">
      <div class="wl-top">
        <div class="wl-brand"><img src="icon.svg" alt="" width="28" height="28"><span>OmniLLM</span></div>
      </div>
      <div class="wl-main pr-main">
        <div class="wl-copy pr-copy">
          <h1 id="pair-title" class="wl-title"></h1>
          <p id="pair-status" class="wl-sub" role="status"></p>
          <div id="pair-ask" hidden>
            <div id="pair-host" class="host"><span class="host-ic"><span class="ic s20"></span></span><span class="host-t"></span><span class="host-tag"></span></div>
            <p id="pair-replace" class="warn" hidden></p>
            <div class="pr-btns"><button id="pair-go" type="button" class="primary" data-t="add"></button><button id="pair-cancel" type="button" class="secondary" data-t="cancel"></button></div>
          </div>
          <div id="sas" class="sas" hidden></div>
          <div id="pair-wait" class="pair-wait" hidden><span class="spinner sm" aria-hidden="true"></span><span data-t="pairWait"></span></div>
          <button id="pair-mismatch" type="button" class="link quiet" data-t="pairMismatch" hidden></button>
          <button id="pair-stop" type="button" class="link quiet" data-t="cancel" hidden></button>
          <div id="pair-again" class="pr-btns" hidden>
            <button id="pair-rescan" type="button" class="primary"><span class="ic i-camera s18"></span><span data-t="scanNew"></span></button>
            <button id="pair-repaste" type="button" class="secondary"></button>
          </div>
          <button id="pair-retry" type="button" class="link quiet" data-t="back" hidden></button>
        </div>
        <!-- This device and your computer, joined by a line that says how far it got. -->
        <div class="wl-art pr-art" aria-hidden="true">
          <div class="lv">
            <span class="lv-node"><span id="lv-me" class="lv-dev me"><span class="ic s30"></span></span><span id="lv-me-t"></span></span>
            <span id="lv-line" class="lv-line"><span class="lv-track"></span><span class="lv-mid"><span class="ic s16"></span></span></span>
            <span class="lv-node"><span class="lv-dev"><span class="ic i-monitor s30"></span></span><span id="lv-hub-t"></span></span>
          </div>
          <!-- Computers, while the digits show: the same digits on the other computer, and where to confirm. -->
          <div class="mock">
            <div class="mock-bar"><i></i><i></i><i></i><span>OmniLLM</span></div>
            <div class="mock-body">
              <p class="mock-h" data-t="addDevice"></p>
              <p class="mock-note mock-note-top" data-t="consoleSas"></p>
              <div id="mock-sas" class="mock-sas"></div>
              <div class="mock-btn"><span data-t="matchAdd"></span><span class="mock-cursor"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section id="chat" class="screen chat" hidden>
    <!-- The chat list: a sidebar on wide screens, a drawer on phones. -->
    <aside id="drawer" class="drawer" hidden>
      <div class="drawer-panel">
        <div class="brand"><img class="brand-mark" src="icon.svg" alt="" width="32" height="32"><span class="brand-text"><span class="brand-name">OmniLLM</span><span class="brand-sub">Your AI, Everywhere</span></span><button id="side-hide" type="button" class="ibtn side-hide" data-ta="hideSide"><span class="ic i-side"></span></button><button id="drawer-close" type="button" class="ibtn drawer-x"><span class="ic i-x"></span></button></div>
        <button id="new-side" type="button" class="newchat"><span class="ic i-compose s16"></span><span data-t="newChat"></span></button>
        <label class="search"><span class="ic i-search s16"></span><input id="chat-search" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></label>
        <ul id="chat-list"></ul>
        <div class="drawer-foot">
          <button id="mac" type="button" class="mac" aria-haspopup="menu" aria-expanded="false" aria-controls="mac-menu"><span id="live-dot" class="live-dot" role="img"></span><span class="mac-t"><b data-t="yourMac"></b><small id="mac-state"></small></span><span class="ic i-updown s16"></span></button>
          <div id="mac-menu" class="pop mac-menu" role="menu" hidden>
            <div class="pop-head"><span class="ic i-mac"></span><span class="pop-head-t"><b id="mac-head"></b><small id="device-line"></small></span></div>
            <hr>
            <button id="lang-btn" type="button" class="pop-item" role="menuitem" aria-expanded="false" aria-controls="lang-list"><span class="ic i-lang s16"></span><span class="nm" data-t="language"></span><small id="lang-now"></small><span class="ic i-chev s14 lang-chev"></span></button>
            <div id="lang-list" class="lang-list" role="group" hidden>
              <button type="button" class="pop-item" role="menuitemradio" data-lang=""><span class="nm" data-t="langMac"></span><span class="ic i-check s16 tick"></span></button>
              <button type="button" class="pop-item" role="menuitemradio" data-lang="zh"><span class="nm">中文</span><span class="ic i-check s16 tick"></span></button>
              <button type="button" class="pop-item" role="menuitemradio" data-lang="en"><span class="nm">English</span><span class="ic i-check s16 tick"></span></button>
            </div>
            <button id="theme-btn" type="button" class="pop-item" role="menuitem" aria-expanded="false" aria-controls="theme-list"><span class="ic i-moon s16"></span><span class="nm" data-t="appearance"></span><small id="theme-now"></small><span class="ic i-chev s14 lang-chev"></span></button>
            <div id="theme-list" class="lang-list" role="group" hidden>
              <button type="button" class="pop-item" role="menuitemradio" data-theme-pick=""><span class="nm" data-t="themeSystem"></span><span class="ic i-check s16 tick"></span></button>
              <button type="button" class="pop-item" role="menuitemradio" data-theme-pick="light"><span class="nm" data-t="themeLight"></span><span class="ic i-check s16 tick"></span></button>
              <button type="button" class="pop-item" role="menuitemradio" data-theme-pick="dark"><span class="nm" data-t="themeDark"></span><span class="ic i-check s16 tick"></span></button>
              <button type="button" class="pop-item" role="menuitemradio" data-theme-pick="time"><span class="nm"><span data-t="themeTime"></span><small class="theme-sub" data-t="themeTimeSub"></small></span><span class="ic i-check s16 tick"></span></button>
            </div>
            <button id="keys-btn" type="button" class="pop-item keys-item" role="menuitem"><span class="ic i-key s16"></span><span class="nm" data-t="shortcuts"></span><small class="kbd-hint" data-k="⌘/"></small></button>
            <button id="install-tip" type="button" class="pop-item" role="menuitem" hidden><span class="ic i-home s16"></span><span class="nm" data-t="addHome"></span></button>
            <hr>
            <p class="pop-note" data-t="chatsLocal"></p>
            <button id="forget" type="button" class="pop-item danger" role="menuitem"><span class="ic i-trash s16"></span><span class="nm" data-t="forget"></span></button>
          </div>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="bar">
        <button id="menu" type="button" class="ibtn" data-ta="chats"><span class="ic i-menu s20"></span></button>
        <button id="bar-title" type="button" class="bar-t" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="tools" data-tools></div>
        <button id="new" type="button" class="ibtn" data-ta="newChat"><span class="ic i-compose s20"></span></button>
      </header>
      <!-- Sidebar hidden on a wide screen: show it again, or start a chat. -->
      <div class="side-btns">
        <button id="side-show" type="button" class="ibtn" data-ta="showSide"><span class="ic i-side s20"></span></button>
        <button id="new-float" type="button" class="ibtn" data-ta="newChat"><span class="ic i-compose s20"></span></button>
      </div>
      <!-- The chat's name at the top (wide screens; phones have it in the bar). Click: its menu. -->
      <div class="tools wide-tools" data-tools></div>
      <div id="chat-head" class="chat-head" hidden><button id="head-title" type="button" class="head-t" aria-haspopup="menu" aria-expanded="false"></button></div>
      <main id="log" class="log" aria-live="polite"></main>
      <div class="dock">
        <div class="dock-in">
          <div class="jump-wrap"><button id="jump" type="button" class="jump" hidden></button></div>
          <div id="banner" class="banner" role="status" hidden></div>
          <form id="composer" class="composer">
            <div id="pending" class="pending" hidden></div>
            <textarea id="input" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
            <div class="comp-row">
              <button id="attach" class="ibtn attach" type="button"><span class="ic i-image"></span></button>
              <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/heic,image/heif" multiple hidden>
              <div class="mwrap">
                <button id="mpick" type="button" class="mpick" aria-haspopup="listbox" aria-expanded="false" aria-controls="mmenu"><span id="pick-dot" class="live-dot" aria-hidden="true"></span><span id="pick-name" class="nmx"></span><span class="ic i-chev s14 pick-chev"></span></button>
                <div id="mmenu" class="pop mmenu" role="listbox" tabindex="-1" hidden></div>
              </div>
              <!-- The chosen model's id lives here (the picker above draws it). -->
              <select id="model" hidden></select>
              <span class="sp"></span>
              <button id="mic" class="ibtn mic" type="button" aria-pressed="false" hidden><span class="ic i-mic"></span><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button>
              <button id="send" class="send" type="submit" data-ta="send"></button>
            </div>
          </form>
        </div>
      </div>
      <div id="drop" class="drop" hidden><span class="ic i-image s20"></span><span data-t="dropHere"></span></div>
    </div>
  </section>
  <!-- In-page questions (delete a chat, remove this device, a tip). -->
  <dialog id="ask" class="ask">
    <p id="ask-text"></p>
    <div class="ask-btns"><button id="ask-no" type="button" class="secondary"></button><button id="ask-yes" type="button" class="primary"></button></div>
  </dialog>
  <dialog id="keys" class="ask keys">
    <h2 data-t="shortcuts"></h2>
    <table id="keys-table"></table>
    <div class="ask-btns"><button id="keys-ok" type="button" class="primary" data-t="gotIt"></button></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
