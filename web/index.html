<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss: ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OmniLLM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<title>OmniLLM</title>
</head>
<body>
<div id="app">
  <section id="boot" class="screen center">
    <div class="spinner" aria-hidden="true"></div>
    <p id="boot-text" class="muted"></p>
  </section>

  <section id="welcome" class="screen center" hidden>
    <img src="icon.svg" alt="" class="logo">
    <h1 data-t="welcomeTitle"></h1>
    <p class="muted" data-t="welcomeBody"></p>
    <button id="scan" class="primary" data-t="scan"></button>
    <details class="paste">
      <summary data-t="pasteInstead"></summary>
      <textarea id="paste-text" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button id="paste-go" class="secondary" data-t="connect"></button>
    </details>
    <p id="welcome-err" class="err" role="alert"></p>
  </section>

  <section id="scanner" class="screen" hidden>
    <video id="cam" playsinline muted></video>
    <canvas id="cam-canvas" hidden></canvas>
    <p class="scan-hint" data-t="scanHint"></p>
    <button id="scan-stop" class="secondary floating" data-t="cancel"></button>
  </section>

  <section id="pairing" class="screen center" hidden>
    <h1 data-t="pairTitle"></h1>
    <div id="pair-ask" hidden>
      <p class="muted" data-t="pairAsk"></p>
      <p id="pair-host" class="host"></p>
      <p id="pair-replace" class="warn" hidden></p>
      <button id="pair-go" class="primary" data-t="connect"></button>
      <button id="pair-cancel" class="secondary" data-t="cancel"></button>
    </div>
    <p id="pair-status" class="muted" role="status"></p>
    <div id="sas" class="sas" hidden></div>
    <p id="pair-err" class="err" role="alert"></p>
    <button id="pair-retry" class="secondary" data-t="back" hidden></button>
  </section>

  <section id="chat" class="screen chat" hidden>
    <header class="bar">
      <button id="menu" class="icon" aria-label="Menu"><span></span></button>
      <select id="model" aria-label="Model"></select>
      <button id="new" class="icon plus" aria-label="New chat"></button>
    </header>
    <div id="banner" class="banner" role="status" hidden></div>
    <main id="log" class="log" aria-live="polite"></main>
    <form id="composer" class="composer">
      <textarea id="input" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
      <button id="send" class="send" type="submit" aria-label="Send"></button>
    </form>
  </section>

  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-panel">
      <h2 data-t="chats"></h2>
      <ul id="chat-list"></ul>
      <div class="drawer-foot">
        <p id="device-line" class="muted small"></p>
        <button id="install-tip" class="link small" data-t="addHome" hidden></button>
        <button id="forget" class="link danger small" data-t="forget"></button>
      </div>
    </div>
  </aside>
</div>
<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
