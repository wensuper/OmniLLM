# relay.ixxzh.com: OmniLLM's public connection service. It only forwards
# end-to-end encrypted frames. No access log at all: the request line holds
# each device's mailbox ID, which stays the same for as long as the device
# is paired, so a log would let the operator follow a person's devices
# across networks (docs/en/security.md promises it doesn't). Never log
# request headers either: a browser device's mailbox secret travels in
# Sec-WebSocket-Protocol.
# Errors go nowhere either: Tengine's error log line for a failed upstream
# names the client address and the request (with the mailbox ID).
server {
    listen 80;
    access_log off;
    error_log /dev/null emerg;
    server_name relay.ixxzh.com;
    location ^~ /.well-known/acme-challenge/ { root /home/yunwei/www/_acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    access_log off;
    error_log /dev/null emerg;
    server_name relay.ixxzh.com;
    ssl_certificate     /etc/https/aliyun/relay.ixxzh.com/relay.ixxzh.com.pem;  # DigiCert (Aliyun), renewed by hand; Let's Encrypt fallback in /etc/https/acme/relay.ixxzh.com/
    ssl_certificate_key /etc/https/aliyun/relay.ixxzh.com/relay.ixxzh.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # No ssl_session_tickets off here: 443 is shared with the other sites,
    # which issue tickets, and with tickets off on this server alone
    # Chromium's WebSocket to the relay failed with ERR_SSL_PROTOCOL_ERROR
    # (alpha.48, 2026-10-24) while Go hubs kept connecting. Change it for
    # every server on this address or not at all.
    server_tokens off;

    location /v1/ {
        proxy_pass http://127.0.0.1:8470;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The relay limits per address using the last X-Forwarded-For entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        # The relay pings every 30 s; idle phones may stay connected for hours.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8470; }
    location / { return 404; }
}
