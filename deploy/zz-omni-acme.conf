# Step 1 only: lets acme.sh prove both new names over port 80 before their
# certificates exist. Removed once zz-relay / zz-omni are in place.
server {
    listen 80;
    server_name relay.ixxzh.com omni.ixxzh.com;
    location ^~ /.well-known/acme-challenge/ { root /home/yunwei/www/_acme; }
    location / { return 404; }
}
