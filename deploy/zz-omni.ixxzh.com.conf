# omni.ixxzh.com: the OmniLLM web client for phones and tablets (static
# files from a signed release; see deploy/install-server.sh). It holds the
# devices' keys: nothing else is served from this name.
server {
    listen 80;
    server_name omni.ixxzh.com;
    location ^~ /.well-known/acme-challenge/ { root /home/yunwei/www/_acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name omni.ixxzh.com;
    ssl_certificate     /etc/https/aliyun/omni.ixxzh.com/omni.ixxzh.com.pem;  # DigiCert (Aliyun), renewed by hand; Let's Encrypt fallback in /etc/https/acme/omni.ixxzh.com/
    ssl_certificate_key /etc/https/aliyun/omni.ixxzh.com/omni.ixxzh.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /home/yunwei/www/omni/current;
    # The release files only: never follow a link out of them.
    disable_symlinks if_not_owner from=$document_root;
    # omni.wasm is 7.5 MB, about 2 MB compressed: on a phone's first visit
    # that is the difference between ~15 s and ~4 s (measured 10-19).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/manifest+json image/svg+xml;
    gzip_vary on;
    index index.html;
    # The service worker pins a whole version; the browser revalidates.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss:; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ \.wasm$ { default_type application/wasm; }
    location = /manifest.webmanifest { default_type application/manifest+json; }
    # $uri/ lets "/" reach index.html (found on the server 10-19).
    location / { try_files $uri $uri/ =404; }
}
