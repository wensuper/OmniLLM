# Release build: signed checksums (cosign keyless, via GitHub OIDC) and an
# SBOM per archive. Archive names match install.sh.
version: 2
project_name: omnillm
before:
  hooks:
    # The web client (phones and tablets), released and signed with the
    # programs; the server serving omni.ixxzh.com installs it from here.
    # Its manifest (every file's sha256) is published and signed with the
    # checksums: omnillm verify web checks a served page against it.
    - sh -c 'scripts/build-web.sh dist-web omnillm-web-manifest.json && tar -czf omnillm-web.tar.gz -C dist-web . && rm -rf dist-web'
builds:
  - id: omnillm-linux
    main: ./cmd/omnillm
    binary: omnillm
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
  # The Mac build needs cgo for the menu bar icon, so it runs on a macOS
  # runner with clang building each architecture natively.
  - id: omnillm-darwin-amd64
    main: ./cmd/omnillm
    binary: omnillm
    env: [CGO_ENABLED=1, "CC=clang -arch x86_64", CGO_CFLAGS=-mmacosx-version-min=13.0, CGO_LDFLAGS=-mmacosx-version-min=13.0]
    goos: [darwin]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: omnillm-darwin-arm64
    main: ./cmd/omnillm
    binary: omnillm
    env: [CGO_ENABLED=1, "CC=clang -arch arm64", CGO_CFLAGS=-mmacosx-version-min=13.0, CGO_LDFLAGS=-mmacosx-version-min=13.0]
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - id: omnillm
    ids: [omnillm-linux, omnillm-darwin-amd64, omnillm-darwin-arm64]
    formats: [tar.gz]
    name_template: "omnillm_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, INSTALL.md]
checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./omnillm-web.tar.gz
    - glob: ./omnillm-web-manifest.json
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}", "--yes"]
    output: true
  # The same signature as one Sigstore bundle (what current cosign expects).
  - id: bundle
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    output: true
release:
  prerelease: auto
  extra_files:
    - glob: ./omnillm-web.tar.gz
    - glob: ./omnillm-web-manifest.json
