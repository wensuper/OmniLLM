<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>OmniLLM</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><img class="mark" src="icon.svg" alt="" width="32" height="32"><span class="brand-text"><span class="brand-name">OmniLLM</span><span class="brand-sub">Your AI, Everywhere</span></span></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="tools">
    <button type="button" class="ghost" id="lang" aria-label="Language" data-aria="ariaLang">中文</button>
    <button type="button" class="ghost" id="theme" aria-label="Theme" data-aria="ariaTheme">◐</button>
  </div>
</header>

<main id="app">
  <!-- The hub stopped while this page was open (its calls no longer answer). -->
  <div id="hub-down" class="banner" role="alert" data-t="hubDown" hidden></div>

  <section id="loading" class="panel"><p data-t="loading"></p></section>

  <section id="login-needed" class="panel" hidden>
    <h1 data-t="loginTitle"></h1>
    <p data-t="loginBody"></p>
    <p class="muted" data-t="loginOr"></p>
    <div class="codebox"><pre class="cmd">omnillm open</pre><button type="button" class="secondary small-btn copy" data-copy="omnillm open" data-t="copy"></button></div>
    <p class="muted small safe-line" data-t="loginSafe"></p>
  </section>

  <!-- First-run wizard -->
  <section id="wizard" class="panel" hidden>
    <!-- Shown when "Connect a model" was opened from the dashboard. -->
    <p class="wiz-back" id="wiz-back-line" hidden><button type="button" class="link" id="wiz-back" data-t="back"></button></p>
    <ol class="steps" aria-label="Steps" data-aria="ariaSteps">
      <li id="st1"><span data-t="step1"></span></li>
      <li id="st2"><span data-t="step2"></span></li>
      <li id="st3"><span data-t="step3"></span></li>
    </ol>

    <div id="w1">
      <h1 data-t="w1Title"></h1>
      <div id="ollama-box" class="choice" hidden>
        <h2 data-t="ollamaFound"></h2>
        <p class="muted" id="ollama-models"></p>
        <button type="button" id="ollama-use" class="primary" data-t="ollamaUse"></button>
      </div>
      <!-- Three ways in, each with its own steps; subscriptions are found by
           themselves once logged in ("Check again"). -->
      <div class="choice">
        <h2 data-t="w1Claude"></h2>
        <ol class="howto"><li data-t="w1Claude1"></li><li data-t="w1Claude2" data-rich></li></ol>
      </div>
      <div class="choice">
        <h2 data-t="w1Codex"></h2>
        <ol class="howto"><li data-t="w1Codex1"></li><li data-t="w1Codex2" data-rich></li></ol>
      </div>
      <details class="choice key-choice">
        <summary data-t="w1Key"></summary>
        <form id="key-form" autocomplete="off">
          <label for="kind" data-t="source"></label>
          <select id="kind">
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="openai">OpenAI</option>
            <option value="openai-compatible" data-t="otherCompatible"></option>
          </select>
          <div id="compat" hidden>
            <label for="cname" data-t="cname"></label><input id="cname" maxlength="40" spellcheck="false">
            <label for="curl" data-t="curl"></label><input id="curl" placeholder="https://" spellcheck="false">
          </div>
          <label for="key" data-t="key"></label>
          <input id="key" type="password" autocomplete="off" spellcheck="false" required>
          <p class="hint" data-t="keyHint"></p>
          <button type="submit" class="primary" data-t="connect"></button>
        </form>
      </details>
      <p class="muted free-line" data-t="w1Free"></p>
      <button type="button" id="recheck" class="secondary" data-t="recheck"></button>
    </div>

    <div id="w2" hidden>
      <h1 data-t="w2Title"></h1>
      <div id="pair-area"></div>
      <!-- Always at the bottom of the step. -->
      <p class="muted skip-line" id="skip-line"><button type="button" class="link" id="skip-pair" data-t="skipPair"></button></p>
    </div>

    <div id="w3" hidden>
      <h1 data-t="w3Title"></h1>
      <form id="try-form">
        <label for="try-model" data-t="model"></label>
        <select id="try-model"></select>
        <label for="try-text" data-t="message"></label>
        <input id="try-text" maxlength="500">
        <button type="submit" class="primary" data-t="send"></button>
      </form>
      <div id="try-reply" class="reply" hidden></div>
      <button type="button" id="finish" class="primary" hidden data-t="finish"></button>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="dash" hidden>
    <!-- Today's spend against the hub's daily total, which can be changed here. -->
    <div class="card spend-card">
      <div><div class="k" data-t="todaySpend"></div><div class="v" id="spend-today"></div><div class="s" data-t="estimate"></div></div>
      <div class="cap" id="cap"></div>
    </div>

    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="devices" data-t="devices"></button>
      <button type="button" role="tab" data-tab="models" data-t="models"></button>
      <button type="button" role="tab" data-tab="apps" data-t="apps"></button>
      <button type="button" role="tab" data-tab="usage" data-t="usage"></button>
    </nav>

    <div class="tab" id="tab-devices">
      <div class="row-head"><button type="button" class="primary" id="add-device" data-t="addDevice"></button></div>
      <div id="pair-dash"></div>
      <!-- Fixed column widths: editing a row never moves the others. -->
      <table class="narrow-hide2 fixed devices-table"><colgroup><col><col class="c-seen"><col class="c-budget"><col class="c-sw"><col class="c-act"></colgroup>
        <thead><tr><th data-t="name"></th><th data-t="lastSeen"></th><th data-t="todayBudget"></th><th data-t="enabled" class="sw"></th><th></th></tr></thead><tbody id="devices"></tbody></table>
      <p class="empty" id="devices-empty" data-t="noDevices" hidden></p>
    </div>

    <div class="tab" id="tab-models" hidden>
      <div class="row-head"><p class="muted" data-t="modelsBody"></p><button type="button" class="primary" id="add-provider" data-t="addProvider"></button></div>
      <table class="models-table"><thead><tr><th data-t="model"></th><th data-t="where"></th><th data-t="humanOnly" class="sw"></th><th data-t="showOnDevices" class="sw"></th><th></th></tr></thead><tbody id="models"></tbody></table>
      <h3 data-t="providers"></h3>
      <table class="providers-table"><thead><tr><th data-t="source"></th><th data-t="keyLast4"></th><th></th></tr></thead><tbody id="providers"></tbody></table>
    </div>

    <div class="tab" id="tab-apps" hidden>
      <div class="row-head"><p class="muted" data-t="appsBody"></p><button type="button" class="primary" id="add-app" data-t="addApp"></button></div>
      <!-- "Add app": its name in place, then its token, shown once. -->
      <form id="app-add" class="inline-add" autocomplete="off" hidden>
        <label for="app-name" data-t="appName"></label>
        <div class="inline-row"><input id="app-name" maxlength="64" spellcheck="false"><div class="btns"><button type="button" class="secondary" id="app-add-cancel" data-t="cancel"></button><button type="submit" class="primary" id="app-add-ok" data-t="add"></button></div></div>
      </form>
      <div id="app-token" class="token-box" hidden></div>
      <table class="fixed apps-table"><colgroup><col><col class="c-budget"><col class="c-sw"><col class="c-act"></colgroup>
        <thead><tr><th data-t="name"></th><th data-t="todayBudget"></th><th data-t="enabled" class="sw"></th><th></th></tr></thead><tbody id="apps"></tbody></table>
      <p class="empty" id="apps-empty" data-t="noApps" hidden></p>
    </div>

    <div class="tab" id="tab-usage" hidden>
      <!-- Today, yesterday or the last 7 days. -->
      <div class="seg" id="usage-range" role="group">
        <button type="button" data-range="today" data-t="rangeToday"></button><button type="button" data-range="yesterday" data-t="rangeYesterday"></button><button type="button" data-range="week" data-t="rangeWeek"></button>
      </div>
      <p class="muted" id="usage-body"></p>
      <!-- Both usage tables share their column widths, so they line up. -->
      <table class="usage-table"><colgroup><col><col class="c-num"><col class="c-num"><col class="c-tok"></colgroup>
        <thead><tr><th data-t="who"></th><th data-t="calls" class="num"></th><th data-t="spend" class="num"></th><th data-t="tokens" class="num narrow-hide"></th></tr></thead><tbody id="usage"></tbody><tfoot id="usage-total"></tfoot></table>
      <p class="empty" id="usage-empty" hidden></p>
      <div id="usage-models-box" hidden>
        <h3 data-t="byModel"></h3>
        <table class="usage-table"><colgroup><col><col class="c-num"><col class="c-num"><col class="c-tok"></colgroup>
          <thead><tr><th data-t="model"></th><th data-t="calls" class="num"></th><th data-t="spend" class="num"></th><th data-t="tokens" class="num narrow-hide"></th></tr></thead><tbody id="usage-models"></tbody><tfoot id="usage-models-total"></tfoot></table>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>
</main>
</body>
</html>
