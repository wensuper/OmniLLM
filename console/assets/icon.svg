<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- OmniLLM: your hub (the core) and your devices on one orbit, in NEXA's
       Aurora family: deep violet tile, violet-to-cyan light, the AI sparkle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241A5E"/><stop offset="1" stop-color="#07061A"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8C7BFF" stop-opacity=".9"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".35"/></linearGradient>
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="12" y1="44" x2="52" y2="20"><stop offset="0" stop-color="#8C7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <radialGradient id="core" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#E4DEFF"/><stop offset=".45" stop-color="#8C7BFF"/><stop offset="1" stop-color="#5B48F0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g filter="url(#glow)">
    <ellipse cx="32" cy="32" rx="22" ry="9.5" transform="rotate(-28 32 32)" fill="none" stroke="url(#link)" stroke-width="3" stroke-opacity=".55"/>
    <circle cx="32" cy="32" r="9" fill="url(#core)"/>
    <path d="M51.42 21.67 A22 9.5 -28 0 1 12.58 42.33" fill="none" stroke="url(#link)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="51.42" cy="21.67" r="4.6" fill="#07061A" stroke="#22D3EE" stroke-width="3"/>
    <circle cx="12.58" cy="42.33" r="3.4" fill="#B8ACFF"/>
    <path d="M18 9 C18.8 14 19.6 14.8 24.6 15.6 C19.6 16.4 18.8 17.2 18 22.2 C17.2 17.2 16.4 16.4 11.4 15.6 C16.4 14.8 17.2 14 18 9Z" fill="#FFFFFF"/>
  </g>
</svg>
