name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    # macOS: the Mac binaries are built with cgo (menu bar icon); Linux ones
    # are cross-compiled without it.
    runs-on: macos-latest
    environment: release   # add required reviewers to this environment in the repo settings
    permissions:
      contents: write   # create the release
      id-token: write   # keyless cosign signing
      actions: read     # see that CI passed for this commit
    steps:
      # The tests ran in CI on this very commit (ci.yml: vet, race tests,
      # staticcheck, govulncheck); running them again here took 3 of the
      # release's 6 minutes (zc 2026-10-21). Tag only after CI is green.
      - name: CI passed for this commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" -q .total_count)
          [ "$n" -gt 0 ] || { echo "CI has not passed for ${{ github.sha }}: tag after CI is green."; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
